<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GridWise — campus energy optimization</title>
<meta name="description" content="GridWise turns a 24-hour campus energy scenario and plain-English operator notes into the cheapest battery schedule that still obeys every constraint.">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   GridWise — energy optimization console
   Palette is brief-locked: graphite / electric teal / solar amber / soft mint.
   ========================================================================== */

:root {
  --graphite: #172126;
  --teal: #149E9A;
  --amber: #E5A93D;
  --mint: #DCEFE8;

  --teal-deep: #0E7B78;
  --teal-wash: #EAF6F5;
  --amber-deep: #B9812A;
  --amber-wash: #FCF3E3;
  --clay: #A8443B;
  --clay-wash: #FAEDEB;

  --bg: #F6F8F7;
  --surface: #FFFFFF;
  --surface-sunk: #FBFCFC;
  --line: #E2E8E6;
  --line-strong: #CBD5D2;

  --ink: #172126;
  --ink-2: #3D4A50;
  --ink-3: #6B7A80;
  --ink-4: #93A1A6;

  --shadow: 0 1px 2px rgba(23, 33, 38, .05), 0 6px 20px -12px rgba(23, 33, 38, .18);
  --shadow-lift: 0 2px 4px rgba(23, 33, 38, .06), 0 18px 40px -20px rgba(23, 33, 38, .28);

  --r-sm: 8px;
  --r: 12px;
  --r-lg: 18px;

  --sans: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --display: "Space Grotesk", var(--sans);

  --rail: 248px;
  --step: cubic-bezier(.22, .68, .28, 1);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101A1E;
    --surface: #17242A;
    --surface-sunk: #141F24;
    --line: #26363C;
    --line-strong: #35494F;
    --ink: #EEF4F3;
    --ink-2: #C3D1D1;
    --ink-3: #94A6A8;
    --ink-4: #6F8286;
    --mint: #1D3C39;
    --teal-wash: #14312F;
    --amber-wash: #2E2617;
    --clay-wash: #33211F;
    --teal: #2FBDB8;
    --amber: #EDBA5B;
    --clay: #D97B70;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px -14px rgba(0, 0, 0, .6);
    --shadow-lift: 0 2px 6px rgba(0, 0, 0, .35), 0 22px 44px -22px rgba(0, 0, 0, .7);
  }
}

:root[data-theme="dark"] {
  --bg: #101A1E;
  --surface: #17242A;
  --surface-sunk: #141F24;
  --line: #26363C;
  --line-strong: #35494F;
  --ink: #EEF4F3;
  --ink-2: #C3D1D1;
  --ink-3: #94A6A8;
  --ink-4: #6F8286;
  --mint: #1D3C39;
  --teal-wash: #14312F;
  --amber-wash: #2E2617;
  --clay-wash: #33211F;
  --teal: #2FBDB8;
  --amber: #EDBA5B;
  --clay: #D97B70;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px -14px rgba(0, 0, 0, .6);
  --shadow-lift: 0 2px 6px rgba(0, 0, 0, .35), 0 22px 44px -22px rgba(0, 0, 0, .7);
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.55 var(--sans);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 {
  font-family: var(--display);
  font-weight: 600;
  letter-spacing: -.017em;
  color: var(--ink);
  margin: 0;
}

h1 { font-size: 1.6rem; line-height: 1.2; }
h2 { font-size: 1.16rem; }
h3 { font-size: 1rem; }

p { margin: 0; }
a { color: var(--teal-deep); }

button, input, textarea, select { font: inherit; color: inherit; }

:where(a, button, input, textarea, select, [tabindex]):focus-visible {
  outline: 2px solid var(--teal);
  outline-offset: 2px;
  border-radius: 4px;
}

.num {
  font-family: var(--display);
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
}

.sr {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ---------------------------------------------------------------- app shell */

.app { display: flex; min-height: 100vh; }

.rail {
  width: var(--rail);
  flex: 0 0 var(--rail);
  min-width: 0;
  background: var(--graphite);
  color: #E6EEEC;
  display: flex;
  flex-direction: column;
  padding: 22px 16px 16px;
  position: sticky;
  top: 0;
  height: 100vh;
}

.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px 22px; }
.brand-mark { width: 30px; height: 30px; flex: 0 0 30px; }
.brand-name {
  font-family: var(--display);
  font-size: 1.07rem;
  font-weight: 600;
  letter-spacing: -.02em;
  color: #fff;
}
.brand-sub { font-size: .72rem; color: #7E9695; margin-top: -3px; }

.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  display: flex; align-items: center; gap: 11px;
  padding: 9px 11px;
  border: 0; border-radius: var(--r-sm);
  background: transparent; color: #B7C8C6;
  text-align: left; cursor: pointer; width: 100%;
  transition: background .16s var(--step), color .16s var(--step);
}
.nav-item svg { width: 17px; height: 17px; flex: 0 0 17px; opacity: .9; }
.nav-item:hover { background: rgba(255, 255, 255, .06); color: #E8F1EF; }
.nav-item[aria-current="page"] {
  background: rgba(20, 158, 154, .17);
  color: #fff;
  box-shadow: inset 2px 0 0 var(--teal);
}
.nav-count {
  margin-left: auto;
  font-family: var(--display);
  font-size: .74rem;
  color: #8AA3A1;
  font-variant-numeric: tabular-nums;
}

.rail-cta { margin-top: 18px; }
.rail-foot { margin-top: auto; padding-top: 16px; }

.status {
  display: flex; align-items: center; gap: 9px;
  padding: 10px 11px;
  border-radius: var(--r-sm);
  background: rgba(255, 255, 255, .045);
  font-size: .78rem;
  color: #9FB4B2;
}
.status-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--teal); flex: 0 0 7px;
  box-shadow: 0 0 0 3px rgba(20, 158, 154, .2);
}
.status[data-state="local"] .status-dot { background: var(--amber); box-shadow: 0 0 0 3px rgba(229, 169, 61, .2); }
.status[data-state="down"] .status-dot { background: var(--clay); box-shadow: 0 0 0 3px rgba(168, 68, 59, .22); }
.status b { display: block; color: #DCE7E5; font-weight: 500; font-size: .8rem; }

.main { flex: 1 1 auto; min-width: 0; }

.topbar {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 20px;
  padding: 30px 40px 20px;
  max-width: 1320px;
}
.topbar-sub { color: var(--ink-3); font-size: .9rem; margin-top: 5px; }

.view { padding: 8px 40px 72px; max-width: 1320px; }
.view[hidden] { display: none; }

/* ---------------------------------------------------------------- controls */

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 16px;
  border: 1px solid transparent;
  border-radius: var(--r-sm);
  background: var(--teal); color: #fff;
  font-weight: 500; font-size: .92rem;
  cursor: pointer;
  transition: background .16s var(--step), box-shadow .16s var(--step), transform .12s var(--step);
}
.btn:hover { background: var(--teal-deep); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; }

.btn-lg { padding: 13px 24px; font-size: 1rem; border-radius: var(--r); }
.btn-block { width: 100%; }

.btn-ghost { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn-ghost:hover { background: var(--surface-sunk); border-color: var(--line-strong); }

.btn-quiet {
  background: transparent; color: var(--ink-2); border-color: transparent;
  padding: 7px 10px; font-size: .86rem;
}
.btn-quiet:hover { background: var(--surface-sunk); color: var(--ink); }

.btn-onDark { background: var(--teal); color: #fff; }
.btn-onDark:hover { background: #17B3AE; }

.btn-danger { background: transparent; color: var(--clay); border-color: var(--line); }
.btn-danger:hover { background: var(--clay-wash); border-color: var(--clay); }

.field { display: block; }
.field-label { display: block; font-size: .85rem; font-weight: 500; color: var(--ink-2); margin-bottom: 6px; }
.field-hint { font-size: .8rem; color: var(--ink-3); margin-top: 6px; }

.input, textarea.input {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  background: var(--surface);
  color: var(--ink);
  transition: border-color .15s var(--step), box-shadow .15s var(--step);
}
.input:hover { border-color: var(--line-strong); }
.input:focus { outline: 0; border-color: var(--teal); box-shadow: 0 0 0 3px rgba(20, 158, 154, .15); }
.input[aria-invalid="true"] { border-color: var(--clay); background: var(--clay-wash); }
textarea.input { resize: vertical; min-height: 76px; line-height: 1.5; }

.input-num { text-align: right; font-family: var(--display); font-variant-numeric: tabular-nums; }

.err {
  display: flex; align-items: flex-start; gap: 7px;
  color: var(--clay); font-size: .82rem; margin-top: 6px;
}
.err svg { width: 14px; height: 14px; flex: 0 0 14px; margin-top: 2px; }

/* ------------------------------------------------------------------- cards */

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow);
}
.card-head {
  display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
  padding: 18px 22px;
  border-bottom: 1px solid var(--line);
}
.card-head p { color: var(--ink-3); font-size: .85rem; margin-top: 3px; }
.card-body { padding: 22px; }
.card-body.flush { padding: 0; }

.grid { display: grid; gap: 18px; }
.select-sample { width: auto; max-width: min(260px, 100%); }
.grid-metrics { grid-template-columns: repeat(auto-fit, minmax(212px, 1fr)); }
.grid-2 { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
.grid-3 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.grid-charts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.split { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.side { position: sticky; top: 20px; align-self: start; }
.stack { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
.grid > *, .stack > *, .split > * { min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.section-title {
  display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  margin: 30px 0 14px;
}
.section-title h2 { flex: 0 0 auto; }
.section-title p { color: var(--ink-3); font-size: .86rem; }

/* ------------------------------------------------------------------ metric */

.metric {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 17px 18px 15px;
  box-shadow: var(--shadow);
  transition: box-shadow .18s var(--step), border-color .18s var(--step);
}
.metric:hover { box-shadow: var(--shadow-lift); border-color: var(--line-strong); }
.metric-top { display: flex; align-items: center; gap: 9px; color: var(--ink-3); }
.metric-top svg { width: 15px; height: 15px; }
.metric-name { font-size: .84rem; font-weight: 500; }
.metric-val {
  font-family: var(--display); font-weight: 600;
  font-size: 1.62rem; line-height: 1.15;
  letter-spacing: -.02em;
  margin-top: 11px;
  font-variant-numeric: tabular-nums;
}
.metric-val small { font-size: .62em; font-weight: 500; color: var(--ink-3); margin-left: 3px; }
.metric-note { font-size: .8rem; color: var(--ink-3); margin-top: 5px; }

.metric[data-accent="teal"] .metric-top { color: var(--teal-deep); }
.metric[data-accent="amber"] .metric-top { color: var(--amber-deep); }

.spark { display: block; width: 100%; height: 30px; margin-top: 10px; overflow: visible; }

/* ------------------------------------------------------------------ badges */

.badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 9px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface-sunk);
  font-size: .77rem; font-weight: 500; color: var(--ink-2);
  white-space: nowrap;
}
.badge svg { width: 12px; height: 12px; }
.badge[data-tone="teal"] { background: var(--teal-wash); border-color: rgba(20, 158, 154, .3); color: var(--teal-deep); }
.badge[data-tone="mint"] { background: var(--mint); border-color: rgba(20, 158, 154, .22); color: var(--teal-deep); }
.badge[data-tone="amber"] { background: var(--amber-wash); border-color: rgba(229, 169, 61, .42); color: var(--amber-deep); }
.badge[data-tone="clay"] { background: var(--clay-wash); border-color: rgba(168, 68, 59, .32); color: var(--clay); }
.badge[data-tone="mute"] { color: var(--ink-3); }

/* ------------------------------------------------------------------- table */

.table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; }
thead th {
  position: sticky; top: 0; z-index: 1;
  background: var(--surface-sunk);
  text-align: right;
  font-size: .78rem; font-weight: 600; color: var(--ink-3);
  padding: 11px 14px;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
thead th:first-child, tbody td:first-child { text-align: left; }
tbody td {
  padding: 10px 14px;
  text-align: right;
  border-bottom: 1px solid var(--line);
  font-variant-numeric: tabular-nums;
  font-family: var(--display);
  font-size: .9rem;
  white-space: nowrap;
}
tbody td:first-child { font-family: var(--sans); }
tbody tr:last-child td { border-bottom: 0; }
tbody tr { transition: background .14s var(--step); }
tbody tr:hover { background: var(--surface-sunk); }
tbody tr[data-peak="1"] td:first-child::after {
  content: "peak";
  margin-left: 8px;
  font: 500 .68rem var(--sans);
  color: var(--amber-deep);
  background: var(--amber-wash);
  padding: 2px 6px; border-radius: 999px;
  vertical-align: middle;
}
tfoot td {
  padding: 12px 14px; text-align: right;
  font-family: var(--display); font-weight: 600;
  font-variant-numeric: tabular-nums;
  border-top: 1px solid var(--line-strong);
  background: var(--surface-sunk);
}
tfoot td:first-child { text-align: left; font-family: var(--sans); }

.act { display: inline-flex; align-items: center; gap: 6px; font-family: var(--sans); font-size: .82rem; }
.act-dot { width: 8px; height: 8px; border-radius: 2px; }
.act[data-a="charge"] { color: var(--teal-deep); }
.act[data-a="charge"] .act-dot { background: var(--teal); }
.act[data-a="discharge"] { color: var(--amber-deep); }
.act[data-a="discharge"] .act-dot { background: var(--amber); border-radius: 50%; }
.act[data-a="idle"] { color: var(--ink-4); }
.act[data-a="idle"] .act-dot { background: var(--ink-4); border-radius: 50%; opacity: .5; }

/* -------------------------------------------------------- 24h entry editor */

.hours-editor { display: grid; gap: 0; }
.hours-head, .hour-row {
  display: grid;
  grid-template-columns: 62px repeat(3, minmax(0, 1fr));
  gap: 10px;
  align-items: center;
}
.hours-head {
  padding: 0 4px 9px;
  border-bottom: 1px solid var(--line);
  font-size: .78rem; font-weight: 600; color: var(--ink-3);
}
.hours-head span:not(:first-child) { text-align: right; padding-right: 12px; }
.hour-row { padding: 4px; border-radius: var(--r-sm); }
.hour-row:hover { background: var(--surface-sunk); }
.hour-tag {
  font-family: var(--display); font-variant-numeric: tabular-nums;
  font-size: .86rem; color: var(--ink-3);
  display: flex; align-items: center; gap: 6px;
}
.hour-tag i {
  width: 4px; height: 16px; border-radius: 2px;
  background: var(--line-strong); font-style: normal;
}
.hour-row[data-sun="1"] .hour-tag i { background: var(--amber); }

.editor-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }

/* ----------------------------------------------------------------- battery */

.batt-vis { padding: 4px 0 2px; }
.batt-shell {
  position: relative;
  height: 60px;
  border: 1px solid var(--line-strong);
  border-radius: 10px;
  background: var(--surface-sunk);
  overflow: hidden;
}
.batt-fill {
  position: absolute; inset: 0 auto 0 0;
  background: var(--teal);
  opacity: .85;
  transition: width .5s var(--step);
}
.batt-reserve {
  position: absolute; top: 0; bottom: 0;
  width: 2px; background: var(--clay);
  transition: left .5s var(--step);
}
.batt-reserve::after {
  content: ""; position: absolute; inset: 0 auto 0 -1px; width: 2px;
}
.batt-scale { display: flex; justify-content: space-between; margin-top: 8px; font-size: .78rem; color: var(--ink-3); }
.batt-legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 14px; font-size: .82rem; color: var(--ink-2); }
.batt-legend span { display: inline-flex; align-items: center; gap: 7px; }
.batt-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

/* ------------------------------------------------------------ instructions */

.instr { display: grid; gap: 14px; }
.instr-item {
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 14px;
  background: var(--surface-sunk);
}
.instr-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 9px; }
.instr-n { font-size: .82rem; font-weight: 500; color: var(--ink-2); }
.examples { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chip {
  border: 1px dashed var(--line-strong);
  background: transparent;
  border-radius: 999px;
  padding: 6px 12px;
  font-size: .81rem; color: var(--ink-2);
  cursor: pointer;
  transition: border-color .15s var(--step), color .15s var(--step), background .15s var(--step);
}
.chip:hover { border-style: solid; border-color: var(--teal); color: var(--teal-deep); background: var(--teal-wash); }

/* ------------------------------------------------------------- energy flow */

.flow-wrap { position: relative; }
.flow { display: block; width: 100%; height: auto; }
.flow-node rect { fill: var(--surface-sunk); stroke: var(--line); }
.flow-node text { font-family: var(--sans); fill: var(--ink); }
.flow-node .flow-val { font-family: var(--display); font-variant-numeric: tabular-nums; }
.flow-path { fill: none; stroke-linecap: round; transition: stroke-width .4s var(--step), opacity .4s var(--step); }
.flow-dash { fill: none; stroke-linecap: round; stroke-dasharray: 5 13; animation: flow 1.1s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -18; } }

.scrub { display: flex; align-items: center; gap: 14px; margin-top: 6px; }
.scrub input[type="range"] { flex: 1 1 auto; accent-color: var(--teal); }
.scrub-hour { font-family: var(--display); font-variant-numeric: tabular-nums; font-weight: 600; min-width: 62px; }
.scrub-play { flex: 0 0 auto; }

/* ---------------------------------------------------------------- timeline */

.timeline {
  display: grid;
  grid-template-columns: repeat(24, minmax(0, 1fr));
  gap: 4px;
  align-items: end;
  height: 128px;
}
.tl-bar {
  position: relative;
  display: flex; flex-direction: column; justify-content: flex-end;
  height: 100%;
  border: 0; padding: 0;
  background: transparent;
  cursor: pointer;
  border-radius: 5px 5px 3px 3px;
  transition: transform .16s var(--step);
}
.tl-bar:hover { transform: translateY(-3px); }
.tl-seg { width: 100%; border-radius: 3px 3px 0 0; transition: height .35s var(--step); }
.tl-seg.solar { background: var(--amber); }
.tl-seg.grid { background: var(--teal); }
.tl-seg.batt { background: var(--graphite); opacity: .45; border-radius: 0 0 3px 3px; }
.tl-bar[aria-pressed="true"] { outline: 2px solid var(--teal); outline-offset: 2px; background: var(--mint); }
.tl-axis {
  display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 4px;
  margin-top: 8px;
  font-family: var(--display); font-variant-numeric: tabular-nums;
  font-size: .68rem; color: var(--ink-4); text-align: center;
}
.tl-axis span:nth-child(even) { visibility: hidden; }

.detail { display: grid; gap: 1px; background: var(--line); border-radius: var(--r); overflow: hidden; }
.detail-row { display: flex; justify-content: space-between; gap: 14px; padding: 10px 14px; background: var(--surface); font-size: .88rem; }
.detail-row dt { color: var(--ink-3); }
.detail-row dd { margin: 0; font-family: var(--display); font-variant-numeric: tabular-nums; font-weight: 500; }

/* ------------------------------------------------------------------ charts */

.chart-box { position: relative; }
.chart { display: block; width: 100%; height: auto; touch-action: pan-y; }
.chart-grid line { stroke: var(--line); stroke-width: 1; }
.chart-axis text { font-family: var(--display); font-size: 10.5px; fill: var(--ink-4); font-variant-numeric: tabular-nums; }

  padding: 9px 11px;

/* -------------------------------------------------------- interpretation */

.interp { display: grid; gap: 14px; }
.interp-card { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.interp-note {

  border-bottom: 1px solid var(--line);
  color: var(--ink-2);
  font-size: .92rem;

.interp-note b { display: block; font: 500 .78rem var(--sans); color: var(--ink-3); margin-bottom: 5px; }
.interp-body { padding: 14px 16px; display: grid; gap: 12px; }
.interp-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.kv > div { min-width: 0; }
.kv dt { font-size: .78rem; color: var(--ink-3); margin-bottom: 3px; }
.kv dd { margin: 0; font-size: .88rem; }
.hourlist { display: flex; flex-wrap: wrap; gap: 4px; }
.hourlist i {
  font-style: normal;
  font-family: var(--display); font-variant-numeric: tabular-nums;
  font-size: .78rem;
  padding: 2px 6px;
  border-radius: 5px;
  background: var(--mint);
  color: var(--teal-deep);
}

/* ------------------------------------------------------------------ checks */

.checks { display: grid; gap: 1px; background: var(--line); border-radius: var(--r); overflow: hidden; }
.check { background: var(--surface); }
.check-top {
  display: flex; align-items: center; gap: 12px;
  width: 100%; padding: 13px 16px;
  border: 0; background: transparent; text-align: left; cursor: pointer;
}
.check-top:hover { background: var(--surface-sunk); }
.check-ico { width: 18px; height: 18px; flex: 0 0 18px; }
.check[data-ok="1"] .check-ico { color: var(--teal-deep); }
.check[data-ok="0"] .check-ico { color: var(--clay); }
.check-name { font-size: .92rem; flex: 1 1 auto; }
.check-state { font-size: .8rem; color: var(--ink-3); }
.check-caret { width: 14px; height: 14px; color: var(--ink-4); transition: transform .2s var(--step); }
.check[data-open="1"] .check-caret { transform: rotate(180deg); }
.check-detail {
  padding: 0 16px 14px 46px;
  font-size: .85rem; color: var(--ink-2);
  font-family: var(--display); font-variant-numeric: tabular-nums;
}
.check[data-open="0"] .check-detail { display: none; }

/* --------------------------------------------------------------- scenarios */

.scen-list { display: grid; gap: 12px; }
.scen {
  display: grid;
  grid-template-columns: minmax(150px, 1.2fr) repeat(4, minmax(90px, .8fr)) auto;
  gap: 16px; align-items: center;
  width: 100%;
  padding: 16px 20px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--shadow);
  cursor: pointer;
  text-align: left;

.scen:hover { box-shadow: var(--shadow-lift); border-color: var(--line-strong); transform: translateY(-1px); }
.scen-id { font-family: var(--display); font-weight: 600; }
.scen-date { font-size: .8rem; color: var(--ink-3); margin-top: 2px; }
.scen-cell dt { font-size: .76rem; color: var(--ink-3); margin-bottom: 3px; }
.scen-cell dd { margin: 0; font-family: var(--display); font-variant-numeric: tabular-nums; font-size: .95rem; }

/* ------------------------------------------------------------------ states */

.empty {
  display: grid; justify-items: center; text-align: center;
  gap: 8px; padding: 58px 24px;
}
.empty-art { width: 84px; height: 84px; color: var(--teal); opacity: .5; margin-bottom: 4px; }
.empty h3 { font-size: 1.05rem; }
.empty p { color: var(--ink-3); max-width: 42ch; }
.empty .row { margin-top: 12px; }

.notice {
  display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-left: 3px solid var(--ink-4);
  border-radius: var(--r-sm);
  background: var(--surface);

}
.notice svg { width: 17px; height: 17px; flex: 0 0 17px; margin-top: 1px; }
.notice > div:not(.notice-act) { flex: 1 1 240px; min-width: 0; }
.notice b { display: block; margin-bottom: 3px; }
.notice p { color: var(--ink-2); }
.notice[data-tone="ok"] { border-left-color: var(--teal); background: var(--teal-wash); }
.notice[data-tone="ok"] svg { color: var(--teal-deep); }
.notice[data-tone="warn"] { border-left-color: var(--amber); background: var(--amber-wash); }
.notice[data-tone="warn"] svg { color: var(--amber-deep); }
.notice[data-tone="bad"] { border-left-color: var(--clay); background: var(--clay-wash); }
.notice[data-tone="bad"] svg { color: var(--clay); }
.notice-act { margin-left: auto; flex: 0 0 auto; }

/* ------------------------------------------------------------- run overlay */

.run {
  position: fixed; inset: 0; z-index: 40;
  display: grid; place-items: center;
  background: rgba(23, 33, 38, .55);
  backdrop-filter: blur(3px);
}
.run[hidden] { display: none; }
.run-card {
  width: min(430px, calc(100vw - 40px));
  background: var(--surface);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-lift);
  padding: 26px;
}
.run-card h3 { margin-bottom: 4px; }
.run-card > p { color: var(--ink-3); font-size: .87rem; margin-bottom: 20px; }
.stages { display: grid; gap: 3px; }
.stage {
  display: flex; align-items: center; gap: 12px;
  padding: 9px 4px;
  font-size: .91rem;
  color: var(--ink-4);
  transition: color .3s var(--step);
}
.stage-ico { width: 18px; height: 18px; flex: 0 0 18px; display: grid; place-items: center; }
.stage-ico i {

  display: block;
  transition: background .3s var(--step), transform .3s var(--step);
}
.stage[data-s="run"] { color: var(--ink); }
.stage[data-s="run"] .stage-ico i { background: var(--teal); animation: pulse 1s var(--step) infinite; }
.stage[data-s="done"] { color: var(--ink-2); }
.stage[data-s="done"] .stage-ico i { background: var(--teal); transform: scale(.7); }
.stage svg { width: 16px; height: 16px; color: var(--teal-deep); }
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(20, 158, 154, .38); }
  55% { box-shadow: 0 0 0 6px rgba(20, 158, 154, 0); }
}
.run-track { height: 3px; border-radius: 2px; background: var(--line); margin-top: 20px; overflow: hidden; }
.run-bar { height: 100%; background: var(--teal); width: 0; transition: width .45s var(--step); }

/* ------------------------------------------------------------------ toasts */

.toasts {
  position: fixed; bottom: 22px; right: 22px; z-index: 50;
  display: grid; gap: 10px; justify-items: end;
}
.toast {
  display: flex; align-items: flex-start; gap: 10px;
  background: var(--graphite); color: #EAF2F0;
  padding: 12px 15px;
  border-radius: var(--r-sm);
  box-shadow: var(--shadow-lift);
  max-width: 340px; font-size: .88rem;
  animation: toastIn .24s var(--step);

.toast svg { width: 16px; height: 16px; flex: 0 0 16px; margin-top: 2px; }
.toast[data-tone="ok"] svg { color: #4ECDC7; }
.toast[data-tone="bad"] svg { color: #E79086; }

/* ------------------------------------------------------------- responsive */

@media (max-width: 1080px) {
  .split { grid-template-columns: minmax(0, 1fr); }
  .grid-charts { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; }
}

@media (max-width: 860px) {
  .app { flex-direction: column; max-width: 100vw; }
  body { overflow-x: hidden; }
  .rail {

  .brand-sub { display: none; }
  .nav { flex-direction: row; gap: 4px; }
  .nav-item { padding: 8px 10px; white-space: nowrap; }

  .nav-item[aria-current="page"] span:not(.nav-count) { display: inline; }
  .nav-item[aria-current="page"] { box-shadow: none; }
  .rail-cta { margin: 0 0 0 auto; }
  .rail-cta .btn { padding: 8px 12px; font-size: .86rem; }
  .rail-foot { display: none; }
  .topbar { padding: 22px 18px 16px; flex-direction: column; align-items: flex-start; }
  .section-title p { flex: 1 1 100%; }
  .view { padding: 4px 18px 64px; }
  h1 { font-size: 1.36rem; }
  .timeline { height: 104px; gap: 2px; }
  .tl-axis { gap: 2px; }
  .tl-axis span:nth-child(even) { display: none; }
  .tl-axis { grid-template-columns: repeat(12, minmax(0, 1fr)); }
  .scen { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
  .scen-status { grid-column: 1 / -1; }
  .hours-head, .hour-row { grid-template-columns: 50px repeat(3, minmax(0, 1fr)); gap: 6px; }
  .card-body { padding: 16px; }
  .card-head { padding: 15px 16px; }
  .toasts { left: 14px; right: 14px; justify-items: stretch; }
  .toast { max-width: none; }
}

@media (max-width: 560px) {
  .rail-cta { display: none; }
  .notice-act { margin-left: 0; width: 100%; }
  .notice-act .btn { width: 100%; }
  .hours-head { font-size: .72rem; }
  .metric-val { font-size: 1.42rem; }
  .grid-metrics { grid-template-columns: repeat(auto-fit, minmax(152px, 1fr)); gap: 12px; }
}

@media print {
  .rail, .rail-cta, .run, .toasts { display: none !important; }
  .card { box-shadow: none; break-inside: avoid; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
  .flow-dash { display: none; }
}

/* ==========================================================================
   GridWise charts — small SVG renderer. Line, area, bar, stacked bar and
   grouped series, with a shared hover cursor and tooltip. No dependencies.
   ========================================================================== */

const NS = "http://www.w3.org/2000/svg";
const el = (name, attrs = {}) => {
  const node = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, String(v));
  return node;
};

const PALETTE = {
  teal: "var(--teal)",
  amber: "var(--amber)",
  graphite: "var(--graphite)",
  mint: "var(--mint)",
  ink: "var(--ink-3)",
};

function niceTicks(min, max, count = 4) {
  if (max === min) { max = min + 1; }
  const span = max - min;
  const raw = span / count;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  const step = (norm >= 5 ? 10 : norm >= 2 ? 5 : norm >= 1 ? 2 : 1) * mag;
  const lo = Math.floor(min / step) * step;
  const hi = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = lo; v <= hi + step / 2; v += step) ticks.push(Math.round(v * 1000) / 1000);
  return { ticks, lo, hi };
}

const fmtNum = (v, unit) => {
  const n = Math.abs(v) >= 1000 ? Math.round(v).toLocaleString() : Math.round(v * 100) / 100;
  return unit ? `${n} ${unit}` : `${n}`;
};

/**
 * spec = {
 *   x: string[], series: [{ name, values, color, kind: 'line'|'area'|'bar', stack?:bool }],
 *   unit, height, yFrom0, xTickEvery, legend: bool
 * }
 */
function drawChart(host, spec) {
  const W = Math.max(300, Math.round(host.clientWidth || host.parentElement?.clientWidth || 720));
  const H = spec.height || 250;
  const pad = { t: 14, r: 12, b: 28, l: 44 };
  const iw = W - pad.l - pad.r;
  const ih = H - pad.t - pad.b;
  const xs = spec.x;
  const nCat = xs.length;

  host.innerHTML = "";
  host.classList.add("chart-box");

  if (spec.legend !== false && spec.series.length > 1) {
    const lg = document.createElement("div");
    lg.className = "legend";
    for (const s of spec.series) {
      const item = document.createElement("span");
      const swatch = document.createElement("i");
      swatch.style.background = s.color || PALETTE.teal;
      if (s.kind === "line") { swatch.style.height = "3px"; swatch.style.borderRadius = "2px"; }
      item.append(swatch, document.createTextNode(s.name));
      lg.appendChild(item);
    }
    host.appendChild(lg);
  }

  const stacked = spec.series.filter((s) => s.stack);
  let maxV = 0, minV = 0;
  for (const s of spec.series) {
    if (s.stack) continue;
    for (const v of s.values) { maxV = Math.max(maxV, v); minV = Math.min(minV, v); }
  }
  for (let i = 0; i < nCat; i++) {
    let sum = 0;
    for (const s of stacked) sum += s.values[i] || 0;
    maxV = Math.max(maxV, sum);
  }
  if (spec.yFrom0 !== false) minV = Math.min(0, minV);
  const { ticks, lo, hi } = niceTicks(minV, maxV || 1, 4);
  const yOf = (v) => pad.t + ih - ((v - lo) / (hi - lo || 1)) * ih;
  const bandW = iw / nCat;
  const xMid = (i) => pad.l + bandW * (i + 0.5);

  const svg = el("svg", {
    class: "chart", viewBox: `0 0 ${W} ${H}`, role: "img",
    "aria-label": spec.ariaLabel || spec.title || "chart", preserveAspectRatio: "none",
  });
  svg.style.height = `${H}px`;
  svg.style.maxHeight = "40vh";

  /* gridlines + y axis */
  const gGrid = el("g", { class: "chart-grid" });
  const gAxis = el("g", { class: "chart-axis" });
  for (const t of ticks) {
    const y = yOf(t);
    gGrid.appendChild(el("line", { x1: pad.l, x2: W - pad.r, y1: y, y2: y, opacity: t === 0 ? 1 : .7 }));
    const label = el("text", { x: pad.l - 8, y: y + 3.5, "text-anchor": "end" });
    label.textContent = Math.abs(t) >= 1000 ? `${Math.round(t / 100) / 10}k` : String(t);
    gAxis.appendChild(label);
  }
  svg.append(gGrid);

  /* x axis */
  const every = spec.xTickEvery || Math.max(1, Math.ceil(nCat / Math.max(4, Math.floor(iw / 44))));
  for (let i = 0; i < nCat; i++) {
    if (i % every) continue;
    const label = el("text", { x: xMid(i), y: H - 9, "text-anchor": "middle" });
    label.textContent = xs[i];
    gAxis.appendChild(label);
  }
  svg.append(gAxis);

  /* bars (stacked first, then plain bars share the remaining band) */
  const barSeries = spec.series.filter((s) => s.kind === "bar");
  const plainBars = barSeries.filter((s) => !s.stack);
  const groupW = Math.max(3, bandW * 0.62);

  if (stacked.length) {
    for (let i = 0; i < nCat; i++) {
      let acc = 0;
      stacked.forEach((s) => {
        const v = s.values[i] || 0;
        if (v <= 0) return;
        const y0 = yOf(acc), y1 = yOf(acc + v);
        svg.appendChild(el("rect", {
          class: "chart-bar", x: xMid(i) - groupW / 2, width: groupW,
          y: y1, height: Math.max(0.6, y0 - y1), fill: s.color || PALETTE.teal, rx: 2,
        }));
        acc += v;
      });
    }
  }
  plainBars.forEach((s, si) => {
    const w = groupW / plainBars.length;
    for (let i = 0; i < nCat; i++) {
      const v = s.values[i] || 0;
      const y0 = yOf(Math.max(0, lo)), y1 = yOf(v);
      svg.appendChild(el("rect", {
        class: "chart-bar", x: xMid(i) - groupW / 2 + si * w, width: Math.max(2, w - 1),
        y: Math.min(y0, y1), height: Math.max(0.6, Math.abs(y0 - y1)),
        fill: s.color || PALETTE.teal, rx: 2, opacity: s.opacity ?? 1,
      }));
    }
  });

  /* areas and lines */
  for (const s of spec.series) {
    if (s.kind === "bar") continue;
    const pts = s.values.map((v, i) => [xMid(i), yOf(v)]);
    const path = pts.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(" ");
    if (s.kind === "area") {
      const base = yOf(Math.max(0, lo));
      svg.appendChild(el("path", {
        class: "chart-area", d: `${path} L${pts[pts.length - 1][0].toFixed(1)} ${base} L${pts[0][0].toFixed(1)} ${base} Z`,
        fill: s.color || PALETTE.teal,
      }));
    }
    svg.appendChild(el("path", {
      class: "chart-line", d: path, stroke: s.color || PALETTE.teal,
      "stroke-width": s.width || 2, "stroke-dasharray": s.dash || "none",
    }));
  }

  /* hover layer */
  const cursor = el("line", { class: "chart-cursor", y1: pad.t, y2: pad.t + ih, opacity: 0 });
  svg.appendChild(cursor);
  const dots = el("g", { opacity: 0 });
  const dotNodes = spec.series.map((s) =>
    el("circle", { class: "chart-dot", r: 3.6, fill: s.color || PALETTE.teal })
  );
  dotNodes.forEach((d) => dots.appendChild(d));
  svg.appendChild(dots);

  const hit = el("rect", { class: "chart-hit", x: pad.l, y: pad.t, width: iw, height: ih });
  svg.appendChild(hit);
  host.appendChild(svg);

  const tip = document.createElement("div");
  tip.className = "tip";
  tip.setAttribute("role", "status");
  host.appendChild(tip);

  let active = -1;
  const show = (i, clientX) => {
    if (i < 0 || i >= nCat) return;
    active = i;
    cursor.setAttribute("x1", xMid(i));
    cursor.setAttribute("x2", xMid(i));
    cursor.setAttribute("opacity", 1);
    dots.setAttribute("opacity", 1);
    spec.series.forEach((s, k) => {
      if (s.kind === "bar") { dotNodes[k].setAttribute("opacity", 0); return; }
      dotNodes[k].setAttribute("opacity", 1);
      dotNodes[k].setAttribute("cx", xMid(i));
      dotNodes[k].setAttribute("cy", yOf(s.values[i] || 0));
    });
    tip.innerHTML = `<b>${spec.tipLabel ? spec.tipLabel(i) : xs[i]}</b>` +
      spec.series.map((s) => `<span class="tip-row"><span>${s.name}</span><span>${fmtNum(s.values[i] || 0, s.unit ?? spec.unit)}</span></span>`).join("");
    const box = svg.getBoundingClientRect();
    const px = box.left + (xMid(i) / W) * box.width;
    tip.style.left = `${clampN(px - box.left, 70, box.width - 70)}px`;
    tip.style.top = `${(pad.t + ih * 0.32) / H * box.height}px`;
    tip.dataset.show = "1";
  };
  const hide = () => { tip.dataset.show = "0"; cursor.setAttribute("opacity", 0); dots.setAttribute("opacity", 0); active = -1; };

  const idxFromEvent = (clientX) => {
    const box = svg.getBoundingClientRect();
    const rel = ((clientX - box.left) / box.width) * W;
    return clampN(Math.floor((rel - pad.l) / bandW), 0, nCat - 1);
  };

  hit.addEventListener("pointermove", (e) => show(idxFromEvent(e.clientX), e.clientX));
  hit.addEventListener("pointerdown", (e) => show(idxFromEvent(e.clientX), e.clientX));
  hit.addEventListener("pointerleave", hide);
  svg.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") { show(Math.min(nCat - 1, active + 1)); e.preventDefault(); }
    if (e.key === "ArrowLeft") { show(Math.max(0, (active < 0 ? 1 : active) - 1)); e.preventDefault(); }
    if (e.key === "Escape") hide();
  });
  svg.setAttribute("tabindex", "0");

  return { hide };
}

function clampN(n, lo, hi) { return Math.min(hi, Math.max(lo, n)); }

/** Tiny inline trend line for metric cards. */
function drawSpark(host, values, color = "var(--teal)") {
  const W = 200, H = 34, pad = 3;
  const min = Math.min(...values), max = Math.max(...values);
  const span = max - min || 1;
  const pts = values.map((v, i) => [
    pad + (i / (values.length - 1 || 1)) * (W - pad * 2),
    H - pad - ((v - min) / span) * (H - pad * 2),
  ]);
  const d = pts.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(" ");
  host.innerHTML = "";
  const svg = el("svg", { class: "spark", viewBox: `0 0 ${W} ${H}`, "aria-hidden": "true", preserveAspectRatio: "none" });
  svg.appendChild(el("path", { d: `${d} L${W - pad} ${H} L${pad} ${H} Z`, fill: color, opacity: .1, stroke: "none" }));
  svg.appendChild(el("path", { d, fill: "none", stroke: color, "stroke-width": 1.8, "stroke-linejoin": "round", "stroke-linecap": "round" }));
  host.appendChild(svg);
}


/* ==========================================================================
   GridWise engine
   1. interpretNotes()  — natural language -> machine-checkable directives
   2. optimize()        — 24h battery / solar / grid schedule, cost minimising
   3. validate()        — replays the schedule against every GridWise rule
   Windows are start-inclusive and end-exclusive. A solar_reduction factor is
   the usable fraction that REMAINS (an 80% reduction gives factor 0.2).
   ========================================================================== */

const EPS = 0.005;
const DIRECTIVE_LABEL = {
  solar_reduction: "Solar reduction",
  minimum_battery_reserve: "Minimum battery reserve",
  no_charge_window: "No charge window",
  no_discharge_window: "No discharge window",
  max_grid_window: "Maximum grid window",
  no_op: "No operation",
};

const r2 = (n) => Math.round(n * 100) / 100;
const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));

/* -------------------------------------------------------------- 1. reading */

const WORD_NUM = {
  zero: 0, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7,
  eight: 8, nine: 9, ten: 10, eleven: 11, twelve: 12, twenty: 20, thirty: 30,
  forty: 40, fifty: 50, sixty: 60, seventy: 70, eighty: 80, ninety: 90,
};

/** Every clock reference in the text, in the order it appears. */
function readClock(text) {
  const t = text.toLowerCase();
  const hits = [];
  const push = (idx, hour, raw) => hits.push({ idx, hour, raw });

  let m;
  const ampm = /\b(1[0-2]|0?[1-9])(?:\s*[:.]\s*([0-5]\d))?\s*(a\.?m\.?|p\.?m\.?)/gi;
  while ((m = ampm.exec(t))) {
    let h = parseInt(m[1], 10) % 12;
    if (/p/i.test(m[3])) h += 12;
    push(m.index, h, m[0]);
  }
  const h24 = /\b([01]?\d|2[0-3])\s*[:.]\s*([0-5]\d)\b(?!\s*(?:a\.?m|p\.?m))/gi;
  while ((m = h24.exec(t))) push(m.index, parseInt(m[1], 10), m[0]);

  const named = /\b(noon|midday|midnight)\b/gi;
  while ((m = named.exec(t))) push(m.index, /midnight/i.test(m[1]) ? 0 : 12, m[0]);

  const bare = /\b(?:from|until|till|to|after|before|by|at|between)\s+(2[0-4]|1\d|[1-9])\s*(?:o'clock|hrs|h)?\b(?!\s*(?:%|kwh|kw\b|a\.?m|p\.?m|[:.]\d))/gi;
  while ((m = bare.exec(t))) {
    const h = parseInt(m[1], 10);
    if (hits.some((x) => Math.abs(x.idx - m.index) < m[0].length + 2)) continue;
    push(m.index + m[0].indexOf(m[1]), h % 24, m[1]);
  }

  hits.sort((a, b) => a.idx - b.idx);
  return hits.filter((x, i) => i === 0 || x.idx !== hits[i - 1].idx);
}

/** Resolve a window phrase into an ascending list of unique hours 0..23. */
function readWindow(text) {
  const t = text.toLowerCase();
  if (/\b(all day|whole day|throughout the day|entire day|for the day|at all times|any time|anytime|all hours|24\s*hours)\b/.test(t)) {
    return { hours: Array.from({ length: 24 }, (_, i) => i), phrase: "the whole day" };
  }
  const c = readClock(t);
  if (!c.length) return { hours: null, phrase: null };

  if (c.length >= 2) {
    let a = c[0].hour;
    let b = c[1].hour;
    if (/\bmidnight\b/i.test(c[1].raw) && a > 0) b = 24;
    if (b <= a) b += b === 0 ? 24 : 0;
    if (b <= a) b = a + 1;
    const hours = [];
    for (let h = a; h < Math.min(b, a + 24); h++) hours.push(h % 24);
    return { hours: dedupe(hours), phrase: `${fmtH(a)} to ${fmtH(b % 24)}` };
  }

  const one = c[0].hour;
  const before = t.slice(0, c[0].idx);
  if (/\b(after|from|starting|onwards?|beyond|past)\b\s*$/.test(before.trim() + " ") || /\b(after|from|starting at|onwards)\b[^.]*$/.test(before)) {
    const hours = [];
    for (let h = one; h <= 23; h++) hours.push(h);
    return { hours, phrase: `${fmtH(one)} to midnight` };
  }
  if (/\b(before|until|till|by|up to)\b[^.]*$/.test(before)) {
    const hours = [];
    for (let h = 0; h < one; h++) hours.push(h);
    return { hours, phrase: `midnight to ${fmtH(one)}` };
  }
  return { hours: [one], phrase: `${fmtH(one)} to ${fmtH((one + 1) % 24)}` };
}

const dedupe = (a) => [...new Set(a)].filter((h) => h >= 0 && h <= 23).sort((x, y) => x - y);

function fmtH(h) {
  const hh = ((h % 24) + 24) % 24;
  const ap = hh < 12 ? "AM" : "PM";
  const base = hh % 12 === 0 ? 12 : hh % 12;
  if (hh === 0) return "midnight";
  if (hh === 12) return "noon";
  return `${base} ${ap}`;
}

function readPercent(text) {
  let m = /(\d+(?:\.\d+)?)\s*(?:%|per\s*cent|percent)/i.exec(text);
  if (m) return parseFloat(m[1]);
  m = /\b(half)\b/i.exec(text);
  if (m) return 50;
  m = /\b(a\s+quarter|one\s+quarter)\b/i.exec(text);
  if (m) return 25;
  m = /\b([a-z]+)\s*(?:%|percent)/i.exec(text);
  if (m && WORD_NUM[m[1].toLowerCase()] != null) return WORD_NUM[m[1].toLowerCase()];
  return null;
}

function readEnergy(text) {
  const m = /(\d+(?:\.\d+)?)\s*(?:kwh|kw\s*h|kilowatt\s*hours?|kw\b)/i.exec(text);
  return m ? parseFloat(m[1]) : null;
}

const has = (t, re) => re.test(t);

/**
 * One directive_interpretation entry per note, in note_index order.
 * Returns { note_index, applies, directive_type, structured_adjustment, explanation, _phrase }
 */
function interpretNotes(notes, battery) {
  return notes.map((raw, i) => {
    const note = String(raw || "").trim();
    const t = note.toLowerCase();
    const noop = (why) => ({
      note_index: i, applies: false, directive_type: "no_op",
      structured_adjustment: null,
      explanation: why || "This note does not change today's 24-hour energy schedule.",
      _phrase: null,
    });
    if (!note) return noop("The note is empty.");

    const win = readWindow(note);
    const solarWords = /\b(solar|pv|panel|panels|rooftop|array|photovoltaic)\b/.test(t);
    const battWords = /\b(battery|batteries|storage|bess|pack|reserve)\b/.test(t);
    const gridWords = /\b(grid|feeder|transformer|import|utility|mains|substation|draw)\b/.test(t);

    /* --- solar reduction ------------------------------------------------- */
    if (solarWords && has(t, /\b(reduc|derate|de-rate|cut|curtail|lower|drop|cover|clean|wash|shade|shading|soil|dust|dirty|maintenance|offline|treated as|only|limited to|available|output|forecast|generation|down)\w*/)) {
      let factor = null;
      const pct = readPercent(note);
      const reducedBy = has(t, /\b(?:reduc\w*|cut|lower\w*|down|drop\w*|less|lower)\b[^.]{0,40}?\bby\b/) ||
        has(t, /\bby\s+(?:roughly|about|around|approximately|up to)?\s*\d+(?:\.\d+)?\s*(?:%|percent)/) ||
        has(t, /\d+(?:\.\d+)?\s*(?:%|percent)\s*(?:reduction|less|lower|drop|decrease|derate)/) ||
        has(t, /\b(?:reduction|decrease|loss)\s+of\s+(?:roughly|about|around)?\s*\d+/);
      const remaining = has(t, /\b(?:treated as|treat as|only|just|about|roughly|around|approximately|assume|expect|use|usable|available|effective|operate at|deliver|produce|yield|capped at|limited to|at)\b[^.]{0,30}?\d+(?:\.\d+)?\s*(?:%|percent)/) ||
        has(t, /\d+(?:\.\d+)?\s*(?:%|percent)\s+of\s+(?:the\s+)?(?:forecast|normal|expected|rated|usual|planned|predicted|capacity|output|generation|potential|baseline)/);

      if (has(t, /\b(offline|no solar|zero solar|out of service|fully covered|completely covered|disconnected|shut\s*down|no generation|unavailable)\b/)) factor = 0;
      else if (pct != null && reducedBy) factor = 1 - pct / 100;
      else if (pct != null && remaining) factor = pct / 100;
      else if (pct != null) factor = pct / 100;
      else if (has(t, /\bhalf\b/)) factor = 0.5;

      if (factor != null) {
        const hours = win.hours && win.hours.length ? win.hours : Array.from({ length: 24 }, (_, k) => k);
        return {
          note_index: i, applies: true, directive_type: "solar_reduction",
          structured_adjustment: { hours, factor: r2(clamp(factor, 0, 1)) },
          explanation: `Usable solar falls to ${Math.round(clamp(factor, 0, 1) * 100)}% of the forecast for ${win.phrase || "the whole day"}.`,
          _phrase: win.phrase || "the whole day",
        };
      }
    }

    /* --- minimum battery reserve ----------------------------------------- */
    if (battWords && has(t, /\b(keep|maintain|hold|retain|reserve|preserve|at least|no less|not drop|never drop|never fall|minimum|min|floor|leave|spare|buffer|emergency|backup|stay above|remain above)\b/) &&
      !has(t, /\b(do not|don't|dont|no|avoid|never)\s+(?:\w+\s+){0,2}(charg|dischar)/)) {
      let kwh = readEnergy(note);
      const pct = readPercent(note);
      if (kwh == null && pct != null && battery?.capacity_kwh) kwh = (pct / 100) * Number(battery.capacity_kwh);
      if (kwh != null) {
        const hours = win.hours && win.hours.length ? win.hours : Array.from({ length: 24 }, (_, k) => k);
        return {
          note_index: i, applies: true, directive_type: "minimum_battery_reserve",
          structured_adjustment: { hours, minimum_energy_kwh: r2(kwh) },
          explanation: `Battery energy stays at or above ${r2(kwh)} kWh for ${win.phrase || "the whole day"}.`,
          _phrase: win.phrase || "the whole day",
        };
      }
    }

    /* --- charge / discharge windows -------------------------------------- */
    const blocked = has(t, /\b(do not|don't|dont|no|never|avoid|refrain|hold off|stop|suspend|without|prevent|cannot|can't|unable|must not|should not|disabled?|disable|block|inhibit|halt|pause|skip|out of service|offline|unavailable|maintenance|servicing|isolat\w*|locked out)\b/);
    const chargeWord = has(t, /\b(charg\w*|recharg\w*|top\s*(?:it\s*)?up|absorb)/);
    const dischargeWord = has(t, /\b(dischar\w*|draw\s+from\s+the\s+batter\w+|drain|deplete|export from the batter\w+|use the batter\w+|batter\w+\s+support)/);

    if (blocked && (chargeWord || dischargeWord)) {
      const iC = t.search(/charg/);
      const iD = t.search(/dischar|drain|deplete/);
      const pickDischarge = dischargeWord && (!chargeWord || (iD >= 0 && (iC < 0 || iD <= iC)));
      const hours = win.hours && win.hours.length ? win.hours : Array.from({ length: 24 }, (_, k) => k);
      const type = pickDischarge ? "no_discharge_window" : "no_charge_window";
      return {
        note_index: i, applies: true, directive_type: type,
        structured_adjustment: { hours },
        explanation: pickDischarge
          ? `The battery must not discharge from ${win.phrase || "midnight to midnight"}.`
          : `The battery must not charge from ${win.phrase || "midnight to midnight"}.`,
        _phrase: win.phrase || "the whole day",
      };
    }

    /* --- maximum grid window --------------------------------------------- */
    if (gridWords && has(t, /\b(not exceed|no more than|cap\w*|limit\w*|max\w*|below|under|至|keep\s+\w+\s+under|restrict\w*|at most|ceiling|no higher)\b/)) {
      const kwh = readEnergy(note);
      if (kwh != null) {
        const hours = win.hours && win.hours.length ? win.hours : Array.from({ length: 24 }, (_, k) => k);
        return {
          note_index: i, applies: true, directive_type: "max_grid_window",
          structured_adjustment: { hours, max_grid_kwh: r2(kwh) },
          explanation: `Grid draw is capped at ${r2(kwh)} kWh per hour for ${win.phrase || "the whole day"}.`,
          _phrase: win.phrase || "the whole day",
        };
      }
    }

    return noop();
  });
}

/* ------------------------------------------------------------ 2. optimising */

/** Turn validated directives into per-hour constraint arrays. */
function buildConstraints(hours, battery, directives) {
  const n = 24;
  const cap = Number(battery.capacity_kwh);
  const minBase = Number(battery.minimum_energy_kwh);
  const c = {
    demand: hours.map((h) => Number(h.demand_kwh)),
    solar: hours.map((h) => Number(h.solar_kwh)),
    tariff: hours.map((h) => Number(h.tariff_bdt_per_kwh)),
    eff: hours.map((h) => Number(h.solar_kwh)),
    factor: Array(n).fill(1),
    minRes: Array(n).fill(minBase),
    noCharge: Array(n).fill(false),
    noDischarge: Array(n).fill(false),
    gridCap: Array(n).fill(Infinity),
    cap, minBase,
    e0: Number(battery.initial_energy_kwh),
    maxC: Number(battery.max_charge_kwh_per_hour),
    maxD: Number(battery.max_discharge_kwh_per_hour),
  };

  for (const d of directives) {
    if (!d.applies || !d.structured_adjustment) continue;
    const a = d.structured_adjustment;
    const hh = (a.hours || []).filter((h) => Number.isInteger(h) && h >= 0 && h < n);
    if (d.directive_type === "solar_reduction") {
      for (const h of hh) { c.factor[h] = Math.min(c.factor[h], a.factor); c.eff[h] = c.solar[h] * c.factor[h]; }
    } else if (d.directive_type === "minimum_battery_reserve") {
      for (const h of hh) c.minRes[h] = Math.max(c.minRes[h], a.minimum_energy_kwh);
    } else if (d.directive_type === "no_charge_window") {
      for (const h of hh) c.noCharge[h] = true;
    } else if (d.directive_type === "no_discharge_window") {
      for (const h of hh) c.noDischarge[h] = true;
    } else if (d.directive_type === "max_grid_window") {
      for (const h of hh) c.gridCap[h] = Math.min(c.gridCap[h], a.max_grid_kwh);
    }
  }
  return c;
}

/**
 * Cost-minimising schedule: serve demand from free solar first, then move
 * battery energy from cheap hours into expensive hours while every bound,
 * window, rate limit and end-of-day neutrality holds.
 */
function optimize(hours, battery, directives) {
  const n = 24;
  const c = buildConstraints(hours, battery, directives);
  const charge = Array(n).fill(0);
  const discharge = Array(n).fill(0);
  const solarToLoad = c.demand.map((d, h) => Math.min(d, c.eff[h]));
  const solarToBatt = Array(n).fill(0);
  const surplus = c.eff.map((e, h) => e - solarToLoad[h]);
  const issues = [];

  /* grid import only pays for the part of charging that did not come from solar */
  const gridAt = (h) => c.demand[h] - solarToLoad[h] + (charge[h] - solarToBatt[h]) - discharge[h];

  const soc = () => {
    const e = Array(n).fill(0);
    let cur = c.e0;
    for (let h = 0; h < n; h++) { cur += charge[h] - discharge[h]; e[h] = cur; }
    return e;
  };

  const canCharge = (h) => !c.noCharge[h] && c.maxC - charge[h] > EPS && discharge[h] <= EPS;
  const canDischarge = (h) => !c.noDischarge[h] && c.maxD - discharge[h] > EPS && charge[h] <= EPS;

  /* headroom below capacity for hours [from..23] */
  const capRoom = (e, from) => {
    let m = Infinity;
    for (let h = from; h < n; h++) m = Math.min(m, c.cap - e[h]);
    return m;
  };
  /* energy above the active reserve for hours [from..23] */
  const resRoom = (e, from) => {
    let m = Infinity;
    for (let h = from; h < n; h++) m = Math.min(m, e[h] - c.minRes[h]);
    return m;
  };

  /* --- forced discharge so a capped feeder can still serve demand -------- */
  const enforceCaps = () => {
    let moved = 0;
    for (let h = 0; h < n; h++) {
      const over = gridAt(h) - c.gridCap[h];
      if (over <= EPS) continue;
      const e = soc();
      const room = Math.min(over, c.maxD - discharge[h], Math.max(0, resRoom(e, h)));
      if (canDischarge(h) && room > EPS) { discharge[h] += room; moved += room; }
    }
    return moved;
  };
  enforceCaps();

  /* --- repair: reserve floors, capacity ceiling, end-of-day neutrality --- */
  const raise = (need, before) => {
    /* add charging in the cheapest feasible hour at or before `before` */
    let best = null;
    for (let i = 0; i <= before; i++) {
      if (!canCharge(i)) continue;
      const e = soc();
      const room = Math.min(c.maxC - charge[i], capRoom(e, i));
      if (room <= EPS) continue;
      const free = Math.max(0, surplus[i] - solarToBatt[i]);
      const cost = free > EPS ? 0 : c.tariff[i];
      const headroom = free > EPS ? Math.min(room, free) : Math.min(room, c.gridCap[i] - gridAt(i));
      if (headroom <= EPS) continue;
      if (!best || cost < best.cost) best = { i, cost, q: Math.min(need, headroom), free: free > EPS };
    }
    if (!best) return 0;
    charge[best.i] += best.q;
    if (best.free) solarToBatt[best.i] += best.q;
    return best.q;
  };

  const lower = (need, before) => {
    let best = null;
    for (let i = 0; i <= before; i++) {
      if (!canDischarge(i)) continue;
      const e = soc();
      const room = Math.min(c.maxD - discharge[i], resRoom(e, i), Math.max(0, gridAt(i)));
      if (room <= EPS) continue;
      if (!best || c.tariff[i] > best.t) best = { i, t: c.tariff[i], q: Math.min(need, room) };
    }
    if (!best) return 0;
    discharge[best.i] += best.q;
    return best.q;
  };

  const repair = () => {
  for (let guard = 0; guard < 400; guard++) {
    const e = soc();
    let acted = false;

    let bad = -1;
    for (let h = 0; h < n; h++) if (e[h] < c.minRes[h] - EPS) { bad = h; break; }
    if (bad >= 0) {
      const moved = raise(c.minRes[bad] - e[bad], bad);
      if (moved > EPS) { acted = true; continue; }
      issues.push(`The ${r2(c.minRes[bad])} kWh reserve cannot be met by hour ${String(bad).padStart(2, "0")} within the charging limits.`);
      break;
    }

    bad = -1;
    for (let h = 0; h < n; h++) if (e[h] > c.cap + EPS) { bad = h; break; }
    if (bad >= 0) {
      const moved = lower(e[bad] - c.cap, bad);
      if (moved > EPS) { acted = true; continue; }
      issues.push(`Battery energy exceeds capacity at hour ${String(bad).padStart(2, "0")} and cannot be discharged within the limits.`);
      break;
    }

    const end = e[n - 1];
    if (end < c.e0 - EPS) {
      if (raise(c.e0 - end, n - 1) > EPS) { acted = true; continue; }
      issues.push("The battery cannot be returned to its starting energy by the end of the day.");
      break;
    }
    if (end > c.e0 + EPS) {
      if (lower(end - c.e0, n - 1) > EPS) { acted = true; continue; }
      issues.push("Surplus battery energy cannot be discharged before the end of the day.");
      break;
    }
    if (!acted) break;
  }
  };
  repair();

  /* --- arbitrage: pair a cheap charge hour with an expensive discharge --- */
  for (let iter = 0; iter < 3000; iter++) {
    const e = soc();
    let best = null;

    for (let j = 0; j < n; j++) {
      if (!canDischarge(j)) continue;
      const gj = gridAt(j);
      if (gj <= EPS) continue;
      for (let i = 0; i < n; i++) {
        if (i === j || !canCharge(i)) continue;
        const free = Math.max(0, surplus[i] - solarToBatt[i]);
        for (const src of free > EPS ? ["solar", "grid"] : ["grid"]) {
          const unit = src === "solar" ? 0 : c.tariff[i];
          const gain = c.tariff[j] - unit;
          if (gain <= 1e-6) continue;

          let q = Math.min(c.maxC - charge[i], c.maxD - discharge[j], gj);
          q = Math.min(q, src === "solar" ? free : c.gridCap[i] - gridAt(i));
          if (i < j) {
            let room = Infinity;
            for (let h = i; h < j; h++) room = Math.min(room, c.cap - e[h]);
            q = Math.min(q, room);
          } else {
            let room = Infinity;
            for (let h = j; h < i; h++) room = Math.min(room, e[h] - c.minRes[h]);
            q = Math.min(q, room);
          }
          if (q <= EPS) continue;
          const value = gain;
          if (!best || value > best.value + 1e-9 || (Math.abs(value - best.value) < 1e-9 && q > best.q)) best = { i, j, q, src, value };
        }
      }
    }
    if (!best) break;
    charge[best.i] += best.q;
    discharge[best.j] += best.q;
    if (best.src === "solar") solarToBatt[best.i] += best.q;
  }

  /* --- final sweep: caps are judged on the finished schedule, not mid-solve */
  if (enforceCaps() > EPS) repair();
  for (let h = 0; h < n; h++) {
    if (gridAt(h) - c.gridCap[h] > EPS) {
      issues.push(`Hour ${String(h).padStart(2, "0")} needs ${r2(gridAt(h))} kWh from the grid but is capped at ${r2(c.gridCap[h])} kWh. The battery cannot cover the gap within its limits.`);
    }
  }

  /* --- assemble the plan ------------------------------------------------- */
  const e = soc();
  const hourly_plan = [];
  let total_grid = 0, total_cost = 0, peak = 0, solar_used_total = 0, solar_avail_total = 0;

  for (let h = 0; h < n; h++) {
    const g = Math.max(0, r2(gridAt(h)));
    const used = r2(solarToLoad[h] + solarToBatt[h]);
    const net = charge[h] - discharge[h];
    const action = net > EPS ? "charge" : net < -EPS ? "discharge" : "idle";
    const amount = action === "idle" ? 0 : r2(Math.abs(net));
    total_grid += g;
    total_cost += g * c.tariff[h];
    peak = Math.max(peak, g);
    solar_used_total += used;
    solar_avail_total += c.eff[h];
    hourly_plan.push({
      hour: h,
      grid_kwh: g,
      solar_used_kwh: used,
      battery_action: action,
      battery_kwh: amount,
      battery_energy_after_kwh: r2(e[h]),
      demand_kwh: r2(c.demand[h]),
      solar_forecast_kwh: r2(c.solar[h]),
      solar_effective_kwh: r2(c.eff[h]),
      tariff_bdt_per_kwh: c.tariff[h],
      hour_cost_bdt: r2(g * c.tariff[h]),
    });
  }

  const applied = directives.filter((d) => d.applies).length;
  return {
    scenario_id: null,
    status: issues.length ? "infeasible" : "optimal",
    issues,
    directive_interpretation: directives,
    hourly_plan,
    total_grid_kwh: r2(total_grid),
    total_cost_bdt: r2(total_cost),
    peak_grid_kwh: r2(peak),
    battery_end_kwh: r2(e[n - 1]),
    solar_used_kwh: r2(solar_used_total),
    solar_available_kwh: r2(solar_avail_total),
    solar_utilization: solar_avail_total > EPS ? r2((solar_used_total / solar_avail_total) * 100) : 0,
    applied_directives: applied,
    plan_summary: buildSummary(directives, peak, solar_avail_total, solar_used_total),
    constraints: c,
  };
}

function buildSummary(directives, peak, avail, used) {
  const bits = [];
  const kinds = directives.filter((d) => d.applies).map((d) => d.directive_type);
  if (kinds.includes("solar_reduction")) bits.push("works around the reduced solar window");
  if (kinds.includes("minimum_battery_reserve")) bits.push("holds the requested reserve");
  if (kinds.includes("no_charge_window")) bits.push("keeps the battery off charge when asked");
  if (kinds.includes("no_discharge_window")) bits.push("leaves the battery untouched in the protected hours");
  if (kinds.includes("max_grid_window")) bits.push("stays under the grid cap");
  if (avail > EPS) bits.push(`uses ${Math.round((used / avail) * 100)}% of usable solar`);
  bits.push(`peaks at ${r2(peak)} kWh from the grid`);
  return `The schedule shifts battery energy into the costliest hours, ${bits.join(", ")}, and returns the battery to its starting level.`;
}

/* ------------------------------------------------------------ 3. validating */

function validate(result) {
  const c = result.constraints;
  const p = result.hourly_plan;
  const out = [];
  const add = (id, name, ok, detail) => out.push({ id, name, ok, detail });

  let worstBalance = 0;
  for (const row of p) {
    const ch = row.battery_action === "charge" ? row.battery_kwh : 0;
    const dis = row.battery_action === "discharge" ? row.battery_kwh : 0;
    const lhs = row.grid_kwh + row.solar_used_kwh + dis;
    const rhs = row.demand_kwh + ch;
    worstBalance = Math.max(worstBalance, Math.abs(lhs - rhs));
  }
  add("balance", "Energy balance satisfied", worstBalance <= 0.02,
    `Largest hourly mismatch between supply and demand: ${r2(worstBalance)} kWh (tolerance 0.01 kWh).`);

  let maxSoc = -Infinity, minSoc = Infinity;
  for (const row of p) { maxSoc = Math.max(maxSoc, row.battery_energy_after_kwh); minSoc = Math.min(minSoc, row.battery_energy_after_kwh); }
  add("capacity", "Battery capacity respected", maxSoc <= c.cap + 0.02,
    `Highest stored energy ${r2(maxSoc)} kWh against a ${r2(c.cap)} kWh capacity.`);

  let resOk = true, resWorst = null;
  p.forEach((row, h) => {
    if (row.battery_energy_after_kwh < c.minRes[h] - 0.02) {
      resOk = false;
      if (!resWorst) resWorst = `Hour ${String(h).padStart(2, "0")} holds ${r2(row.battery_energy_after_kwh)} kWh against a ${r2(c.minRes[h])} kWh floor.`;
    }
  });
  add("reserve", "Minimum battery reserve respected", resOk,
    resWorst || `Lowest stored energy ${r2(minSoc)} kWh, never below the active floor.`);

  let chMax = 0, disMax = 0;
  for (const row of p) {
    if (row.battery_action === "charge") chMax = Math.max(chMax, row.battery_kwh);
    if (row.battery_action === "discharge") disMax = Math.max(disMax, row.battery_kwh);
  }
  add("chargeRate", "Charging limits respected", chMax <= c.maxC + 0.02,
    `Largest charge in one hour ${r2(chMax)} kWh against a ${r2(c.maxC)} kWh limit.`);
  add("dischargeRate", "Discharging limits respected", disMax <= c.maxD + 0.02,
    `Largest discharge in one hour ${r2(disMax)} kWh against a ${r2(c.maxD)} kWh limit.`);

  let solarOk = true, solarNote = null;
  p.forEach((row, h) => {
    if (row.solar_used_kwh > c.eff[h] + 0.02) {
      solarOk = false;
      solarNote = `Hour ${String(h).padStart(2, "0")} uses ${r2(row.solar_used_kwh)} kWh of an available ${r2(c.eff[h])} kWh.`;
    }
  });
  add("solar", "Solar availability respected", solarOk,
    solarNote || `Every hour draws at or below its usable solar, after any reduction directive.`);

  const viol = [];
  p.forEach((row, h) => {
    if (c.noCharge[h] && row.battery_action === "charge") viol.push(`charging at hour ${String(h).padStart(2, "0")}`);
    if (c.noDischarge[h] && row.battery_action === "discharge") viol.push(`discharging at hour ${String(h).padStart(2, "0")}`);
    if (row.grid_kwh > c.gridCap[h] + 0.02) viol.push(`grid cap exceeded at hour ${String(h).padStart(2, "0")}`);
  });
  const dirCount = result.directive_interpretation.filter((d) => d.applies).length;
  add("directives", "Operator instructions respected", viol.length === 0,
    viol.length ? `Conflicts found: ${viol.join(", ")}.` : `All ${dirCount} applied ${dirCount === 1 ? "directive holds" : "directives hold"} across the 24-hour plan.`);

  const end = p[p.length - 1].battery_energy_after_kwh;
  add("neutral", "End-of-day battery neutrality satisfied", Math.abs(end - c.e0) <= 0.02,
    `Battery ends at ${r2(end)} kWh against a ${r2(c.e0)} kWh start.`);

  const recGrid = r2(p.reduce((s, r) => s + r.grid_kwh, 0));
  const recCost = r2(p.reduce((s, r) => s + r.grid_kwh * r.tariff_bdt_per_kwh, 0));
  add("totals", "Reported totals match the schedule",
    Math.abs(recGrid - result.total_grid_kwh) <= 0.02 && Math.abs(recCost - result.total_cost_bdt) <= 0.02,
    `Recalculated ${recGrid} kWh and ${recCost} BDT from the hourly plan.`);

  return out;
}

/* ------------------------------------------------------------------ inputs */

function validateInput(draft) {
  const errors = {};
  if (!String(draft.scenario_id || "").trim()) errors.scenario_id = "Give the scenario a name so you can find it again.";
  else if (!/^[\w][\w .-]{0,39}$/.test(draft.scenario_id.trim())) errors.scenario_id = "Use letters, numbers, spaces, dots or dashes, up to 40 characters.";

  const rows = draft.hours || [];
  if (rows.length !== 24) errors.hours = "The scenario needs exactly 24 hourly rows.";
  const cellErrors = {};
  rows.forEach((row, h) => {
    for (const key of ["demand_kwh", "solar_kwh", "tariff_bdt_per_kwh"]) {
      const v = row[key];
      if (v === "" || v == null || Number.isNaN(Number(v))) cellErrors[`${h}:${key}`] = "Enter a number";
      else if (Number(v) < 0) cellErrors[`${h}:${key}`] = "Cannot be negative";
      else if (key === "demand_kwh" && Number(v) > 100000) cellErrors[`${h}:${key}`] = "Too large";
    }
  });
  if (Object.keys(cellErrors).length) errors.cells = cellErrors;

  const b = draft.battery || {};
  const num = (k) => Number(b[k]);
  const bErr = {};
  for (const k of ["capacity_kwh", "initial_energy_kwh", "minimum_energy_kwh", "max_charge_kwh_per_hour", "max_discharge_kwh_per_hour"]) {
    if (b[k] === "" || b[k] == null || Number.isNaN(num(k))) bErr[k] = "Enter a number";
    else if (num(k) < 0) bErr[k] = "Cannot be negative";
  }
  if (!Object.keys(bErr).length) {
    if (num("capacity_kwh") <= 0) bErr.capacity_kwh = "Capacity must be greater than zero";
    if (num("initial_energy_kwh") > num("capacity_kwh")) bErr.initial_energy_kwh = "Starting energy cannot exceed capacity";
    if (num("minimum_energy_kwh") > num("capacity_kwh")) bErr.minimum_energy_kwh = "Reserve cannot exceed capacity";
    if (num("initial_energy_kwh") < num("minimum_energy_kwh")) bErr.initial_energy_kwh = "Starting energy is below the reserve";
    if (num("max_charge_kwh_per_hour") <= 0) bErr.max_charge_kwh_per_hour = "Charging rate must be greater than zero";
    if (num("max_discharge_kwh_per_hour") <= 0) bErr.max_discharge_kwh_per_hour = "Discharging rate must be greater than zero";
  }
  if (Object.keys(bErr).length) errors.battery = bErr;

  const notes = (draft.operator_notes || []).map((s) => String(s || "").trim());
  const filled = notes.filter(Boolean);
  if (!filled.length) errors.notes = "Add at least one operator instruction.";
  else if (filled.length > 3) errors.notes = "GridWise reads a maximum of three instructions.";
  else if (filled.some((s) => s.length > 400)) errors.notes = "Keep each instruction under 400 characters.";

  return { ok: Object.keys(errors).length === 0, errors };
}

function runScenario(input) {
  const directives = interpretNotes(input.operator_notes, input.battery);
  const result = optimize(input.hours, input.battery, directives);
  result.scenario_id = input.scenario_id;
  result.checks = validate(result);
  if (result.checks.some((c) => !c.ok) && result.status === "optimal") result.status = "check_failed";
  return result;
}

  const batt = row.battery_kwh;
  const charging = row.battery_action === "charge";
  const discharging = row.battery_action === "discharge";
  const max = Math.max(solar, grid, batt, 1);
  const w = (v) => (v <= 0.01 ? 0 : 2.5 + (v / max) * 11);
  const socPct = Math.round((row.battery_energy_after_kwh / c.cap) * 100);

  const node = (x, y, wid, hei, title, val, sub, stroke) => `

  return `<svg class="flow" viewBox="0 0 760 292" role="img"
      aria-label="Energy flow at hour ${hh(hour)}: solar ${kwh(solar)} kWh, grid ${kwh(grid)} kWh, battery ${row.battery_action} ${kwh(batt)} kWh">

    ${node(28, 28, 168, 78, "Solar used", solar, `of ${kwh(row.solar_effective_kwh)} kWh usable`, "var(--amber)")}

    ${node(300, 100, 174, 92, "Campus demand", row.demand_kwh, `hour ${hh(hour)}:00`, "var(--line-strong)")}

    <div class="scrub">
      <button class="btn btn-ghost scrub-play" id="playBtn" aria-label="${state.playing ? "Pause" : "Play"} the day">${state.playing ? I.pause : I.play}</button>
      <input type="range" id="flowRange" min="0" max="23" step="1" value="${state.flowHour}" aria-label="Hour of day">
      <span class="scrub-hour" id="flowLabel">${hh(state.flowHour)}:00</span>
    </div>
  </div></div>

  <div class="section-title"><h2>24-hour overview</h2><p>Where the campus load came from, hour by hour.</p></div>
  <div class="card"><div class="card-body">
    <div data-chart="overview"></div>
  </div></div>`;
}

/* ------------------------------------------------------------ new optimization */

function batteryVis(b) {
  const cap = Number(b.capacity_kwh) || 1;
  const init = Math.max(0, Math.min(Number(b.initial_energy_kwh) || 0, cap));
  const min = Math.max(0, Math.min(Number(b.minimum_energy_kwh) || 0, cap));
  return `<div class="batt-vis">
    <div class="batt-shell" role="img" aria-label="Battery starts at ${kwh(init)} kWh of ${kwh(cap)} kWh, with a ${kwh(min)} kWh reserve">
      <div class="batt-fill" style="width:${(init / cap) * 100}%"></div>
      <div class="batt-reserve" style="left:${(min / cap) * 100}%"></div>
    </div>
    <div class="batt-scale"><span class="num">0</span><span class="num">${kwh(cap)} kWh</span></div>
    <div class="batt-legend">
      <span><i style="background:var(--teal)"></i>Starting energy ${kwh(init)} kWh</span>
      <span><i style="background:var(--clay);width:3px;border-radius:1px"></i>Reserve floor ${kwh(min)} kWh</span>
      <span><i style="background:var(--line-strong)"></i>Headroom ${kwh(Math.max(0, cap - init))} kWh</span>
    </div>
  </div>`;
}

const BATT_FIELDS = [
  ["capacity_kwh", "Battery capacity", "kWh", "Total usable storage."],
  ["initial_energy_kwh", "Starting energy", "kWh", "Energy stored at midnight. The day must end here too."],
  ["minimum_energy_kwh", "Minimum energy", "kWh", "The battery never falls below this."],
  ["max_charge_kwh_per_hour", "Max charge rate", "kWh/h", "Most the battery can absorb in one hour."],
  ["max_discharge_kwh_per_hour", "Max discharge rate", "kWh/h", "Most the battery can supply in one hour."],
];

const EXAMPLES = [
  "Reduce solar availability by 50% between 1 PM and 4 PM.",
  "Keep at least 20 kWh in the battery.",
  "Do not discharge the battery between 6 PM and 8 PM.",
  "No battery charging from 9 AM to 11 AM for inverter servicing.",
  "Grid draw must not exceed 150 kWh per hour between 6 PM and 9 PM.",
];

function viewNew() {
  const d = state.draft;
  const e = state.showErrors ? state.errors : {};
  const cells = e.cells || {};
  const bErr = e.battery || {};
  const notes = d.operator_notes.length ? d.operator_notes : [""];

  return `

      <div class="card-head">
        <div><h2>Scenario</h2><p>A name you will recognise in the scenario list.</p></div>

      </div>
      <div class="card-body">
        <label class="field" style="max-width:420px">
          <span class="field-label">Scenario ID</span>
          <input class="input" id="scenarioId" value="${esc(d.scenario_id)}" maxlength="40"
            ${e.scenario_id ? 'aria-invalid="true"' : ""} placeholder="CAMPUS-0918">
        </label>
        ${errLine(e.scenario_id)}
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <div><h2>24-hour energy data</h2><p>Demand, solar forecast and tariff for each hour from 00 to 23.</p></div>
        <span class="badge" data-tone="mute">24 rows</span>
      </div>
      <div class="card-body">
        <div class="editor-tools">

          <button class="btn btn-ghost" data-fill="typical">Typical campus day</button>
          <button class="btn btn-ghost" data-fill="clear">Clear values</button>
          <span class="field-hint" style="margin:0 0 0 auto">Paste a column of 24 numbers into any first cell to fill it.</span>
        </div>
        <div class="split">
          <div>
            <div class="hours-editor">

                <span>Hour</span><span>Demand (kWh)</span><span>Solar (kWh)</span><span>Tariff (BDT/kWh)</span>
              </div>
              ${d.hours.map((row, h) => `
                <div class="hour-row" data-sun="${Number(row.solar_kwh) > 0 ? 1 : 0}">
                  <span class="hour-tag"><i></i>${hh(h)}</span>
                  ${["demand_kwh", "solar_kwh", "tariff_bdt_per_kwh"].map((k) => `
                    <input class="input input-num" data-cell="${h}:${k}" value="${row[k]}" inputmode="decimal"
                      aria-label="${k === "demand_kwh" ? "Demand" : k === "solar_kwh" ? "Solar" : "Tariff"} at hour ${hh(h)}"
                      ${cells[`${h}:${k}`] ? 'aria-invalid="true"' : ""}>`).join("")}
                </div>`).join("")}
            </div>
            ${errLine(e.hours)}
            ${Object.keys(cells).length ? `<div class="err">${I.alert}<span>${Object.keys(cells).length} cell${Object.keys(cells).length > 1 ? "s" : ""} need a valid, non-negative number.</span></div>` : ""}
          </div>
          <div class="stack side">
            <div class="card" style="box-shadow:none">
              <div class="card-head"><div><h3>Live profile</h3><p>Updates as you type.</p></div></div>
              <div class="card-body"><div data-chart="draftProfile"></div></div>
            </div>
            <div class="card" style="box-shadow:none">
              <div class="card-head"><div><h3>Tariff</h3><p>Where energy is expensive.</p></div></div>
              <div class="card-body"><div data-chart="draftTariff"></div></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><div><h2>Battery configuration</h2><p>The schedule must respect every one of these limits.</p></div></div>
      <div class="card-body">
        <div class="split">
          <div class="grid grid-3">
            ${BATT_FIELDS.map(([key, label, unit, hint]) => `
              <label class="field">
                <span class="field-label">${label} <span style="color:var(--ink-4);font-weight:400">${unit}</span></span>

                  ${bErr[key] ? 'aria-invalid="true"' : ""}>

            <div class="card-body" id="battVis">${batteryVis(d.battery)}</div>

    <div class="card">
      <div class="card-head">

      <div class="card-body">

                ${notes.length > 1 ? `<button class="btn btn-quiet" data-delnote="${i}">${I.trash}<span>Remove</span></button>` : ""}
              </div>
              <textarea class="input" data-note="${i}" rows="2" maxlength="400"

                aria-label="Operator instruction ${i + 1}">${esc(note)}</textarea>

            </div>`).join("")}
        </div>
        ${errLine(e.notes)}
        <div class="row" style="margin-top:14px">
          <button class="btn btn-ghost" id="addNote" ${notes.length >= 3 ? "disabled" : ""}>${I.plus}<span>Add instruction</span></button>

        </div>

    ${state.showErrors && !state.errors.ok && Object.keys(state.errors).length ? `

    <div class="row" style="justify-content:space-between">
      <div class="field-hint" style="margin:0;max-width:52ch">

      </div>
      <button class="btn btn-lg" id="optimize">${I.bolt}<span>Optimize energy</span></button>
