<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GridWise — campus energy optimization</title>
<meta name="description" content="GridWise turns a 24-hour campus energy scenario and plain-English operator notes into the cheapest battery schedule that still obeys every constraint.">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23172126'/%3E%3Cpath d='M18.6 5.5 11 17.2h5.3L14.4 26.5 23 14.2h-5.6z' fill='%23E5A93D'/%3E%3C/svg%3E">
</head>
<body>

<div class="app">
  <aside class="rail" id="rail"></aside>

  <main class="main">
    <header class="topbar" id="topbar"></header>
    <div class="view" id="view"></div>
  </main>
</div>

<div class="run" id="run" hidden role="dialog" aria-modal="true" aria-labelledby="runTitle">
  <div class="run-card">
    <h3 id="runTitle">Optimizing</h3>
    <p>Reading your notes, then solving the 24-hour schedule.</p>
    <div class="stages" id="stages"></div>
    <div class="run-track"><div class="run-bar" id="runBar"></div></div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module" src="assets/js/app.js"></script>
</body>
</html>
